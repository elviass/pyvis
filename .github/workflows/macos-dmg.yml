name: macOS DMG

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release version from tag
        if: github.ref_type == 'tag'
        run: python3 tools/apply_release_version.py "$GITHUB_REF_NAME"

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build and verify macOS DMG
        run: ./tools/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Pyvis-macOS
          path: client/build/macos/packages/Pyvis.dmg
          if-no-files-found: error
