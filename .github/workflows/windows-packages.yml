name: Windows packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release version from tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: python tools/apply_release_version.py $env:GITHUB_REF_NAME

      - name: Install Flutter and WiX
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP flutter
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix = Join-Path $env:RUNNER_TEMP wix
          dotnet tool install wix --tool-path $wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $wix wix.exe) extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @((Join-Path $sdk bin), $wix) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable ZIP and MSI
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Sign and verify MSI
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (!$env:WINDOWS_PFX_BASE64 -or !$env:WINDOWS_PFX_PASSWORD) {
            throw 'Missing the Windows test signing certificate or password.'
          }
          $packages = 'client/build/windows/packages'
          $pfx = Join-Path $env:RUNNER_TEMP pyvis-test.pfx
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (!$signtool) { throw 'SignTool was not found in the Windows SDK.' }
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
            $publicCert = Export-Certificate -Cert $certificate -FilePath "$packages/windows-test.cer"
            Import-Certificate -FilePath $publicCert.FullName -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            $msi = Get-Item "$packages/*.msi"
            & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed.' }
            & $signtool.FullName verify /pa /v $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw 'MSI signature verification failed.' }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            if ($certificate) {
              Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -ErrorAction SilentlyContinue
              Remove-Item "Cert:\LocalMachine\Root\$($certificate.Thumbprint)" -ErrorAction SilentlyContinue
            }
          }

      - name: Verify both packages
        shell: pwsh
        run: |
          $packages = 'client/build/windows/packages'
          $iconAsset = 'data/flutter_assets/assets/ide/pyvis.png'
          $iconHash = (Get-FileHash 'client/assets/ide/pyvis.png').Hash
          function Confirm-PyvisPayload([string]$Directory) {
            if (!(Test-Path "$Directory/pyvis_editor.exe")) { throw 'Pyvis executable is missing.' }
            if ((Get-FileHash "$Directory/$iconAsset").Hash -ne $iconHash) {
              throw 'Packaged in-app icon differs from the source asset.'
            }
            & "$Directory/python/python.exe" -B -c 'import pyvis_runtime'
            if ($LASTEXITCODE -ne 0) { throw 'Packaged CPython failed.' }
          }
          $zip = Get-Item "$packages/*-portable.zip"
          $portable = Join-Path $env:RUNNER_TEMP pyvis-portable
          Expand-Archive $zip.FullName $portable
          Confirm-PyvisPayload $portable
          $payloadHashes = @{}
          foreach ($file in @('pyvis_editor.exe', 'data/app.so')) {
            $payloadHashes[$file] = (Get-FileHash -LiteralPath "$portable/$file").Hash
          }
          $msi = Get-Item "$packages/*.msi"
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ShellIcon {
            [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
            public static extern uint ExtractIconEx(string path, int index, IntPtr large, IntPtr small, uint count);
          }
          '@
          $shell = New-Object -ComObject WScript.Shell
          function Confirm-ShortcutIcon([string]$Path, [string]$Executable, [switch]$Desktop) {
            if (!(Test-Path -LiteralPath $Path)) { throw "Shortcut is missing: $Path" }
            $link = $shell.CreateShortcut($Path)
            $icon = ($link.IconLocation -replace ',\s*-?\d+$', '').Trim('"')
            if ($Desktop) {
              if ($link.TargetPath -ne $Executable) { throw "Incorrect shortcut target: $($link.TargetPath)" }
              if (!$icon) { $icon = $link.TargetPath }
            }
            if (!(Test-Path -LiteralPath $icon) -or
                (Get-FileHash -LiteralPath $icon).Hash -ne (Get-FileHash -LiteralPath $Executable).Hash -or
                [ShellIcon]::ExtractIconEx($icon, -1, [IntPtr]::Zero, [IntPtr]::Zero, 0) -eq 0) {
              throw "Shortcut icon did not resolve to the Pyvis executable icon: $Path"
            }
          }
          function Test-Msi([string]$App, [string]$Programs, [string]$Desktop, [string]$Options, [switch]$CreateDesktop) {
            $log = Join-Path $env:RUNNER_TEMP pyvis-msi.log
            $installed = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$log`" $Options" -Wait -PassThru
            if ($installed.ExitCode -ne 0) {
              Get-Content $log -Tail 80
              throw "MSI install returned $($installed.ExitCode)."
            }
            $exe = Join-Path $App pyvis_editor.exe
            $startLink = Join-Path ([Environment]::GetFolderPath($Programs)) 'Pyvis.lnk'
            $desktopLink = Join-Path ([Environment]::GetFolderPath($Desktop)) 'Pyvis.lnk'
            try {
              Confirm-PyvisPayload $App
              foreach ($file in $payloadHashes.Keys) {
                if ((Get-FileHash -LiteralPath "$App/$file").Hash -ne $payloadHashes[$file]) {
                  throw "The MSI installed a different build of $file."
                }
              }
              Confirm-ShortcutIcon $startLink $exe
              if ($CreateDesktop) {
                Confirm-ShortcutIcon $desktopLink $exe -Desktop
              } elseif (Test-Path -LiteralPath $desktopLink) {
                throw 'An unrequested desktop shortcut was created.'
              }
            } finally {
              $removed = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
              if ($removed.ExitCode -ne 0) { throw "MSI uninstall returned $($removed.ExitCode)." }
            }
            foreach ($path in @($exe, $startLink, $desktopLink)) {
              if (Test-Path -LiteralPath $path) { throw "MSI uninstall left $path behind." }
            }
          }
          Test-Msi (Join-Path $env:ProgramFiles Pyvis) CommonPrograms CommonDesktopDirectory 'ALLUSERS=1'
          $custom = Join-Path $env:LOCALAPPDATA 'Pyvis custom folder'
          Test-Msi $custom Programs DesktopDirectory "ALLUSERS=2 MSIINSTALLPERUSER=1 INSTALLFOLDER=`"$custom`" PYVISDESKTOP=1" -CreateDesktop

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: Pyvis-Windows-x64
          path: |
            client/build/windows/packages/*.msi
            client/build/windows/packages/*-portable.zip
            client/build/windows/packages/windows-test.cer
          if-no-files-found: error
