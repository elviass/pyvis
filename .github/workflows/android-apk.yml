name: Android signed APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Flutter and Android NDK
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Install Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Build and verify release APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: app-release
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing Android release keystore}"
          : "${ANDROID_STORE_PASSWORD:?Missing Android release keystore password}"
          : "${ANDROID_KEY_PASSWORD:?Missing Android release key password}"
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pyvis-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          flutter build apk --release --target-platform android-arm64,android-x64
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          cert="$RUNNER_TEMP/pyvis-android-public.der"
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_STORE_PASSWORD -file "$cert"
          expected=$(sha256sum "$cert" | cut -d' ' -f1)
          result=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          actual=$(printf '%s\n' "$result" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$expected" = "$actual"
          printf 'Verified APK certificate SHA-256: %s\n' "$actual"

      - uses: actions/upload-artifact@v4
        with:
          name: Pyvis-Android
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
