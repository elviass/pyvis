name: pyvis_editor
description: Python 图形化学习编辑器
publish_to: none
version: 0.1.1+3
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  re_editor:
    path: vendor/re_editor
  re_highlight: ^0.0.3
  file_picker: ^10.3.0
  path: ^1.9.0
  material_ui: ^1.11.0
  flutter_svg: ^2.3.4
  flutter_inappwebview: 6.2.0-beta.3
  desktop_drop: ^0.8.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - assets/ide/
    - assets/ide/brand/
    - assets/graph/
    - assets/graph/vendor/
    - ../runtime/pyvis_runtime/
    - ../runtime/pyvis_runtime/vendor/
    - ../runtime/pyvis_runtime/vendor/spelling/
    - ../examples/
    - ../examples/多文件/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
